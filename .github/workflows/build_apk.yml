name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: 4. Configure Android & Get Packages
        run: |
          flutter create . --platforms=android --org=com.profileflow
          flutter pub get

      - name: 5. Build Android APKs
        run: |
          flutter build apk --debug
          flutter build apk --release

      - name: 6. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProfileFlow-Android-APKs
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30
